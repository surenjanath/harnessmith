[package]
name = "harness2"
version = "0.1.0"
edition = "2021"
description = "harnessmith: self-improving, self-healing agent harnesses (a Rust port of Harness²) with a model-agnostic runtime and web UI"
repository = "https://github.com/surenjanath/harnessmith"
license = "Apache-2.0"

[lib]
name = "harness2"
path = "src/lib.rs"

[[bin]]
name = "harness2"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
glob = "0.3"
similar = "2"
ureq = { version = "2", features = ["json"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
fs2 = "0.4"
once_cell = "1"
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
wait-timeout = "0.2"
base64 = "0.22"
toml = "0.8"
flate2 = "1"
tar = "0.4"

[dev-dependencies]
