name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install bubblewrap (sandbox tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - name: Smoke test (offline end to end)
        shell: bash
        run: |
          ./target/release/harness2 --version
          ./target/release/harness2 models test mock/mock-1
          ./target/release/harness2 solve "Write a one-line greeting to output/answer.md" --model mock/mock-1 --project ci-smoke

  windows:
    name: Build and smoke test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      # The agent's shell tools run under Git for Windows' bash, which the runner has.
      - name: Smoke test (offline end to end)
        shell: bash
        run: |
          ./target/release/harness2.exe --version
          ./target/release/harness2.exe models test mock/mock-1
          ./target/release/harness2.exe solve "Write a one-line greeting to output/answer.md" --model mock/mock-1 --project ci-smoke
      # The unit tests assume a Unix filesystem in places; run them to see, without failing the build.
      - name: Unit tests (informational)
        continue-on-error: true
        run: cargo test --release --locked --lib
