name: Release

# Builds itself. Every push to main refreshes the rolling "nightly" pre-release; a tag v*
# publishes a versioned release. Both carry binaries for Linux, macOS and Windows.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  exe: harness2 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, exe: harness2 }
          - { os: macos-latest,     target: aarch64-apple-darwin,      exe: harness2 }
          - { os: macos-latest,     target: x86_64-apple-darwin,       exe: harness2 }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    exe: harness2.exe }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          ./target/${{ matrix.target }}/release/${{ matrix.exe }} --version
          ./target/${{ matrix.target }}/release/${{ matrix.exe }} models test mock/mock-1
      - name: Package
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME}"; [[ "$GITHUB_REF" == refs/tags/* ]] || ver=nightly
          name="harnessmith-${ver}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          cp docs/GETTING_STARTED.md "dist/$name/"
          # Benchmark mode needs the runner sources and pins next to the binary.
          cp -R third_party "dist/$name/"
          mkdir -p "dist/$name/dependencies"
          cp dependencies/README.md dependencies/PINNED.md dependencies/ASSETS.json "dist/$name/dependencies/"
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            tar -czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz*
            dist/*.zip*

  publish:
    name: Publish release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Versioned release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
      # The rolling pre-release: move the tag to this commit, replace the assets.
      - name: Nightly release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f nightly && git push -f origin nightly
          gh release view nightly >/dev/null 2>&1 || gh release create nightly --prerelease --title "Nightly build" --notes "Built automatically from the latest commit on main."
          gh release edit nightly --prerelease --notes "Built automatically from main at ${GITHUB_SHA::7}. Download the archive for your system, unpack it and run harness2 serve. Versioned releases are listed separately."
          gh release upload nightly dist/* --clobber

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
